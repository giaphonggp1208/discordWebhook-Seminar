[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leave-demo-fastapi"
version = "1.0.0"
description = "FastAPI foundation for the Discord leave-request seminar demo"
requires-python = ">=3.10"
dependencies = [
  "pydantic-settings>=2.6,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pynacl>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["discord_integration*", "leave_demo*"]
